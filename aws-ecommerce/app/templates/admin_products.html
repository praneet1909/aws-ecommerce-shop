{% extends "base.html" %}{% block content %}<div class="row" style="margin-bottom:16px"><h2 class="sec" style="margin:0">Manage products</h2><a class="btn" href="{{ url_for('admin_new_product') }}">+ New product</a></div>
<div class="card" style="overflow-x:auto"><table><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th></th></tr>
{% for p in products %}<tr><td><img class="thumb" src="{{ image_url(p.image_key) }}" alt=""></td><td><b>{{ p.name }}</b></td><td>{{ p.category }}</td><td>{{ p.price|money }}</td>
<td style="text-align:right"><a class="btn btn-o btn-sm" href="{{ url_for('admin_edit_product', pid=p.id) }}">Edit</a>
<form class="inline" method="post" action="{{ url_for('admin_delete_product', pid=p.id) }}" onsubmit="return confirm('Delete this product?')"><button class="btn-red btn-sm">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
